name: Deploy Zen Hub to Pages

on:
  push:
    branches: ["main"] # अगर तुम्हारी ब्रांच का नाम master है, तो यहाँ master कर देना
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      name: Checkout
      uses: actions/checkout@v4

      name: Setup Pages
      uses: actions/configure-pages@v5

      name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # तुम्हारी सारी फाइलें (index.html, sw.js) root में हैं

      name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
